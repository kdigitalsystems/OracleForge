# Weekly update PRs, reviewed by hand: GitHub Actions are pinned to full commit
# SHAs (the repo requires it), so without this the pins would go stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
