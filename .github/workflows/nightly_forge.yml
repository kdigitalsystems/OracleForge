name: OracleForge Nightly Engine

on:
  schedule:
    # Sunday-Thursday 23:00 UTC — prepares the next US trading morning.
    # Sunday covers Monday open; Friday is intentionally skipped because the
    # Sunday run refreshes weekend news before Monday orders.
    - cron: '0 23 * * 0-4'

  workflow_dispatch:

# One run at a time: an overlapping retry, backstop dispatch or manual run
# could otherwise double-apply the once-per-day model-score update.
# A newer pending run replaces an older pending one, which is harmless for
# a resumable job.
concurrency:
  group: nightly-forge
  cancel-in-progress: false

jobs:
  execute_loop:
    # Require the 'gpu' label so the job only lands on a fully provisioned
    # machine (Ollama + models + ~/.ssh/alpaca_paper_keys). Unprovisioned
    # runners (e.g. servert130) lack the label and are skipped, so jobs queue
    # for a good machine instead of failing at Start Ollama / Verify Alpaca.
    #
    # Deliberately NOT containerized (unlike morning/evening/regenerate):
    # this job manages the host Ollama systemd service (sudo systemctl
    # restart, a self-heal that has fired in production) and pulls models
    # with the host ollama binary. Neither works inside a job container.
    #
    # Needs the Alpaca key file and Ollama with the configured models. nvidia-gpu
    # keeps it off server2 (AMD), which has neither yet; drop the label once
    # runner_health.yml canary=true passes there. Known issue: deepseek-r1:8b
    # returned gibberish on server1 under the real prompts, leaving a handful
    # of ACTIVE signals a night instead of ~70 and its runner dropped mid-job
    # on 2026-10-22. The "Preflight" step below fails the job early on any
    # runner whose models misbehave, so the retry can land elsewhere.
    runs-on: [self-hosted, nvidia-gpu]
    timeout-minutes: 720

    permissions:
      contents: write

    steps:
      - name: Reclaim workspace from container jobs
        # The containerized jobs (morning/evening/regenerate) run as root in
        # this same workspace and hand it back when done, but a cancelled or
        # killed container job can still leave root-owned files, which make
        # checkout fail with EACCES (every nightly from 2026-08-27 died this
        # way). The runner user can't chown root files without sudo, but it
        # is in the docker group, so do it from a throwaway container. The
        # python:3.12 image is already cached for the container jobs.
        run: |
          if [ -n "$(find "$GITHUB_WORKSPACE" -not -user "$(id -u)" -print -quit 2>/dev/null)" ]; then
            echo "Reclaiming root-owned files in $GITHUB_WORKSPACE"
            docker run --rm -v "$GITHUB_WORKSPACE:/w" python:3.12 chown -R "$(id -u):$(id -g)" /w
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A re-run checks out the run's original commit by default, which
          # predates the checkpoints earlier attempts pushed. forge_loop then
          # can't resume and redoes the day, and its pushes conflict with
          # the ones already on main. Always start from main's tip.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          # No pip cache: on this self-hosted runner pip's own ~/.cache already
          # persists across runs, and the cache-save post-step is a flaky
          # cleanup surface that can hang/fail the whole job (seen after a
          # power blip killed the runner mid-cleanup).

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        # Discover rather than list modules, so a new test_*.py file runs
        # without anyone remembering to add it here. The suite is order-
        # independent, so discovery's alphabetical order is safe.
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Start Ollama
        run: |
          # forge_loop.py only needs the Ollama HTTP API on :11434. Ollama runs
          # as a persistent systemd service here, but it can briefly stop
          # answering /api/tags (busy, post-reboot, transient blip) — which is
          # what failed a run while the service was actually up for 11h. So:
          # check the endpoint; if it's down, deterministically RESTART the
          # service (the runner has passwordless sudo), wait generously, and
          # only then fall back to launching the binary. Fail only if it never
          # comes up.
          check() { curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; }

          wait_up() {  # $1 = max seconds
            for _ in $(seq 1 "$(( $1 / 5 ))"); do
              check && return 0
              sleep 5
            done
            check
          }

          if check; then
            echo "Ollama already serving on :11434."
          else
            echo "Ollama not reachable; restarting the systemd service..."
            sudo -n systemctl restart ollama 2>/dev/null \
              || systemctl --user restart ollama 2>/dev/null \
              || true
            if wait_up 180; then
              echo "Ollama came up after service restart."
            else
              echo "Service restart did not help; trying to launch the binary directly..."
              OLLAMA=$(command -v ollama 2>/dev/null \
                || ls /usr/local/bin/ollama /usr/bin/ollama /bin/ollama \
                      "$HOME/.local/bin/ollama" /snap/bin/ollama 2>/dev/null | head -1)
              if [ -n "$OLLAMA" ]; then
                echo "Launching $OLLAMA serve ..."
                "$OLLAMA" serve > /tmp/ollama.log 2>&1 &
                wait_up 120 || true
              fi
            fi
          fi

          if ! check; then
            echo "ERROR: Ollama is not serving after restart + launch attempts."
            sudo -n systemctl status ollama --no-pager 2>/dev/null | tail -20 || true
            [ -f /tmp/ollama.log ] && tail -20 /tmp/ollama.log || true
            exit 1
          fi

          # Confirm models are available via the API (no binary required).
          echo "Installed models:"
          curl -s http://localhost:11434/api/tags

      - name: Ensure required Ollama models are pulled
        run: |
          # The Ollama service being up doesn't mean the models config/models.json
          # asks for are actually present under those exact tags -- this runner
          # pool is shared across other repos, and a model set drifting out from
          # under us here fails *silently*: forge_loop's LLM calls 404, exhaust
          # their retries, and fall back to a synthetic placeholder range that's
          # excluded from consensus. Every ticker gets skipped, but the job still
          # exits 0 -- there's nothing here that raises, so CI stays green while
          # the forge produces zero real signals. (This exact silent failure ran
          # for three weeks before anyone noticed.) Actively pull -- not just
          # check -- each required model so a drifted/pruned model can't
          # reproduce it, then hard-fail if any are still missing afterward.
          OLLAMA=$(command -v ollama 2>/dev/null \
            || ls /usr/local/bin/ollama /usr/bin/ollama /bin/ollama \
                  "$HOME/.local/bin/ollama" /snap/bin/ollama 2>/dev/null | head -1)
          if [ -z "$OLLAMA" ]; then
            echo "ERROR: ollama binary not found on PATH or common install locations."
            exit 1
          fi

          models=$(python3 -c "import json; print('\n'.join(json.load(open('config/models.json'))))")
          echo "Required models:"
          echo "$models"

          missing=()
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            echo "Pulling $m ..."
            "$OLLAMA" pull "$m" || echo "  [!] pull failed for $m"
          done <<< "$models"

          installed=$(curl -s http://localhost:11434/api/tags)
          while IFS= read -r m; do
            [ -z "$m" ] && continue
            if ! echo "$installed" | python3 -c "
          import json, sys
          tags = {t['name'] for t in json.load(sys.stdin).get('models', [])}
          sys.exit(0 if '$m' in tags else 1)
          "; then
              missing+=("$m")
            fi
          done <<< "$models"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: model(s) still missing after pull: ${missing[*]}"
            exit 1
          fi
          echo "All required models confirmed present."

      - name: Preflight, both models must forecast sanely on this runner
        timeout-minutes: 30
        run: |
          # Forecasts 4 tickers with the production prompt in a throwaway
          # sandbox (nothing in this checkout changes) and fails if a model
          # falls back on more than half. A bad runner used to commit ~95%
          # fallback forecasts for weeks without any step failing.
          python3 scripts/model_canary.py

      - name: Build ticker universe from Alpaca
        run: |
          # The watchlist is refreshed opportunistically: if this fails (an
          # Alpaca API change broke it on 2026-10-20 and took three nightlies
          # down), forecast the committed universe instead of nothing.
          python3 update_tickers.py || echo "::warning::update_tickers.py failed; continuing with the committed config/tickers.json"

      - name: Verify ticker list
        run: |
          python3 -c "
          import json, sys
          tickers = json.load(open('config/tickers.json'))
          assert isinstance(tickers, list) and len(tickers) > 0, 'config/tickers.json is empty'
          print(f'OK: {len(tickers)} tickers ready')
          "

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Execute OracleForge AI Inference
        # Checkpoint to disk every 10 tickers (fine-grained resume) but push
        # upstream only every 100 tickers — i.e. process ~100 tickers, push,
        # process the next ~100, and so on. forge_loop is resumable (skips
        # finished tickers; the once-per-day score update is guarded), so on a
        # transient mid-run crash we re-invoke it and it continues from the last
        # checkpoint (losing at most 10 tickers of work, not a whole stage).
        run: |
          for attempt in 1 2 3; do
            echo "=== Forge attempt $attempt ==="
            if python3 forge_loop.py --batch-size 10 --push-every 100 --push; then
              echo "Forge completed on attempt $attempt."
              exit 0
            fi
            echo "Forge attempt $attempt failed; resuming in 30s..."
            sleep 30
          done
          echo "ERROR: forge did not complete after 3 attempts."
          exit 1

      - name: Validate outputs
        run: python3 scripts/validate_outputs.py

      - name: Refresh backtest and walk-forward study
        run: |
          # Evidence-only: replays all stored signals under the live rules
          # (~30s, one Alpaca bar download) and never touches live config.
          # Bounded and non-blocking so it can't hold up the trading run.
          timeout 300 python3 backtest.py --walk-forward \
            || echo "Backtest refresh failed or timed out; keeping prior reports."

      - name: Generate GitHub Pages report
        run: python3 scripts/generate_html_report.py

      - name: Commit remaining state
        # forge_loop already committed + pushed config/state/history/reports
        # incrementally; this only catches any final trailing changes.
        # docs/index.html is committed separately below -- see that step for
        # why (it's what was actually causing evening_cleanup's daily
        # failures: rebasing one run's regenerated-HTML diff onto another's
        # concurrently-pushed version is a near-guaranteed unresolvable
        # conflict on an opaque generated blob).
        run: |
          git add config/ state/analyst_scores.json history/ reports/

          if git diff --staged --quiet; then
            echo "Nothing further to commit (forge pushed state incrementally)."
          else
            git commit -m "Automated OracleForge nightly state"
            for attempt in 1 2 3 4 5; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push attempt $attempt failed; retrying in 5s..."
              sleep 5
              if [ "$attempt" = "5" ]; then
                echo "ERROR: could not push state after 5 attempts."
                exit 1
              fi
            done
          fi

      - name: Commit dashboard
        run: |
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || { echo "Pull attempt $attempt failed; retrying in 5s..."; sleep 5; continue; }
            # Regenerate from whatever's on main now, not the pre-pull
            # snapshot -- guarantees this commit is never a stale replay.
            python3 scripts/generate_html_report.py
            git add docs/
            if git diff --staged --quiet; then
              echo "Dashboard unchanged after settling on latest main."
              exit 0
            fi
            git commit -m "Automated OracleForge nightly dashboard"
            if git push origin HEAD:main; then
              echo "Pushed dashboard on attempt $attempt."
              exit 0
            fi
            echo "Dashboard push attempt $attempt failed; retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done
          echo "ERROR: could not push dashboard after 5 attempts."
          exit 1

      - name: Clean up this job's footprint on the runner
        # Runs even when an earlier step failed. Removes only OracleForge's own
        # leftovers (workspace outputs, our temp files, pip cache entries unused
        # for 30 days); the runner is shared, so other projects' workspaces,
        # the tool cache, docker and the Ollama models are left alone.
        if: always()
        run: bash scripts/runner_cleanup.sh
