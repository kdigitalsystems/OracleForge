name: OracleForge Evening Cleanup

on:
  schedule:
    # Weekdays 21:05 UTC: 5:05 PM EDT in summer, 4:05 PM EST in winter.
    # Cron is fixed UTC, so the time has to be after the close under both;
    # 20:05 was 3:05 PM, mid-session, once DST ended. trader.py --close also
    # checks Alpaca's calendar and skips holidays and still-open sessions.
    - cron: '5 21 * * 1-5'

  workflow_dispatch:

# One run at a time: an overlapping retry, backstop dispatch or manual run
# could otherwise act on the same positions twice (e.g. two market sells).
# A newer pending run replaces an older pending one, which is harmless for
# a same-day job.
concurrency:
  group: evening-cleanup
  cancel-in-progress: false

jobs:
  close:
    # 'gpu' label = fully provisioned machine (also has ~/.ssh/alpaca_paper_keys
    # and Docker, verified on both pool machines via runner_health.yml);
    # keeps the job off unprovisioned runners like servert130.
    runs-on: [self-hosted, gpu]
    # Containerized for isolation and a reproducible Python environment; see
    # morning_orders.yml for the volume rationale (keys path, separate
    # container pip cache).
    container:
      image: python:3.12
      volumes:
        - /home/saqib/.ssh/alpaca_paper_keys:/github/home/.ssh/alpaca_paper_keys:ro
        - /home/saqib/.cache/pip-container:/github/home/.cache/pip
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Alpaca connection
        run: |
          python3 -c "
          import alpaca_client
          client = alpaca_client.get_trading_client()
          positions = alpaca_client.get_positions(client)
          print(f'OK: connected to Alpaca: {len(positions)} open position(s)')
          "

      - name: Settle fills and update journal
        id: settle
        run: python3 trader.py --close

      - name: Generate trade attribution
        if: steps.settle.outputs.skipped != 'true'
        run: python3 backtest.py --attribution

      - name: Regenerate GitHub Pages dashboard
        if: steps.settle.outputs.skipped != 'true'
        run: python3 scripts/generate_html_report.py

      - name: Commit settlement state
        if: steps.settle.outputs.skipped != 'true'
        run: |
          # Container runs as root while the mounted workspace carries the
          # host user's uid; git refuses such repos (dubious ownership), and
          # for config --local the failure is a misleading "not inside a git
          # repository". Allow this workspace explicitly.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # docs/index.html is committed separately below: it's regenerated
          # wholesale by every workflow that touches it (this one, nightly,
          # regenerate_report.yml), so when two runs push around the same
          # time, rebasing one's HTML diff onto the other's is a near-
          # guaranteed unresolvable conflict on an opaque generated blob
          # (this is what was actually failing here). Splitting it out means
          # a docs/ conflict never blocks the real settlement data from
          # landing, and the docs retry loop below just regenerates fresh
          # from whatever's on main instead of trying to merge two versions
          # of a file that's never hand-edited.
          git add state/ history/ reports/

          if git diff --staged --quiet; then
            echo "No fills to record today."
          else
            git commit -m "Evening settlement $(date -u '+%Y-%m-%d')"
            # Rebase + retry: another scheduled workflow may have advanced main.
            for attempt in 1 2 3 4 5; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push attempt $attempt failed; retrying in 5s..."
              sleep 5
              if [ "$attempt" = "5" ]; then
                echo "ERROR: could not push settlement state after 5 attempts."
                exit 1
              fi
            done
          fi

      - name: Commit dashboard
        if: steps.settle.outputs.skipped != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || { echo "Pull attempt $attempt failed; retrying in 5s..."; sleep 5; continue; }
            # Regenerate from whatever's on main now, not the pre-pull
            # snapshot -- guarantees this commit is never a stale replay.
            python3 scripts/generate_html_report.py
            git add docs/
            if git diff --staged --quiet; then
              echo "Dashboard unchanged after settling on latest main."
              exit 0
            fi
            git commit -m "Evening dashboard $(date -u '+%Y-%m-%d')"
            if git push origin HEAD:main; then
              echo "Pushed dashboard on attempt $attempt."
              exit 0
            fi
            echo "Dashboard push attempt $attempt failed; retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done
          echo "ERROR: could not push dashboard after 5 attempts."
          exit 1

      - name: Return workspace to host runner user
        # This container runs as root, but the workspace is shared with the
        # host-native nightly job (runner user). Root-owned leftovers,
        # .git included, make that job's checkout fail with EACCES; this is
        # what broke every nightly run from 2026-08-27. The workspace dir
        # itself is created by the host runner, so its owner is the uid to
        # restore.
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
