name: Runner Health Probe

# Dispatch-only diagnostic: reports what a self-hosted runner actually provides
# (Docker, Ollama and its models, GPU, Alpaca keys, disk), and optionally runs
# a forecast canary to answer "can this machine host the nightly?".
#
# Target one machine with runner_labels, e.g. ["self-hosted","amd-gpu"] for
# server2, ["self-hosted","wsl"] for the desktop, or
# ["self-hosted","nvidia-gpu","hephaestus"] for server1. Without it the job
# lands on whichever gpu runner is free; dispatch it a couple of times back to
# back to sample several.
#
# canary=true runs scripts/model_canary.py: the REAL forecast (both models, the
# production prompt) on 6 tickers in a throwaway sandbox. Nothing is committed,
# pushed or pulled; it fails if a configured model is missing or if a model
# falls back on more than half the tickers (the failure mode that made
# deepseek-r1 return gibberish on server1). The nightly runs the same script
# as its Preflight step.

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: 'JSON array of runner labels to target'
        required: false
        default: '["self-hosted","gpu"]'
      canary:
        description: 'Also run the forecast canary (about 10 to 30 minutes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 5
    steps:
      - name: Report runner capabilities
        shell: bash
        run: |
          echo "runner: $RUNNER_NAME"
          echo "--- python ---"
          python3 --version || echo "python3: NOT INSTALLED"
          echo "--- docker ---"
          if command -v docker >/dev/null 2>&1; then
            docker --version || true
            docker info --format 'server: {{.ServerVersion}}' 2>/dev/null \
              || echo "docker CLI present but daemon not usable by this user"
          else
            echo "docker: NOT INSTALLED"
          fi
          echo "--- gpu ---"
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader || true
          elif command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showproductname --showmeminfo vram 2>/dev/null | head -12 || true
          else
            echo "no nvidia-smi or rocm-smi on PATH"
            (lspci 2>/dev/null | grep -iE 'vga|3d|display' | head -3) || true
          fi
          echo "--- ollama ---"
          command -v ollama >/dev/null 2>&1 && ollama --version 2>&1 | head -2 || echo "ollama binary: NOT FOUND"
          if curl -sf -m 5 http://localhost:11434/api/tags -o /tmp/ollama_tags.json 2>/dev/null; then
            echo "ollama API: serving"
            python3 -c "import json; print('models:', ', '.join(m['name'] for m in json.load(open('/tmp/ollama_tags.json'))['models']) or '(none)')"
          else
            echo "ollama API: not reachable (the nightly starts it itself)"
          fi
          echo "--- alpaca keys ---"
          [ -f "$HOME/.ssh/alpaca_paper_keys" ] && echo "keys: present" || echo "keys: MISSING"
          echo "--- disk ---"
          df -h / | tail -1

  canary:
    if: ${{ inputs.canary }}
    needs: probe
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make sure Ollama is serving (same logic as the nightly; never pulls)
        shell: bash
        run: |
          check() { curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; }
          wait_up() {
            for _ in $(seq 1 "$(( $1 / 5 ))"); do check && return 0; sleep 5; done
            check
          }
          if check; then
            echo "Ollama already serving on :11434."
          else
            echo "Ollama not reachable; restarting the systemd service..."
            sudo -n systemctl restart ollama 2>/dev/null || systemctl --user restart ollama 2>/dev/null || true
            if ! wait_up 120; then
              OLLAMA=$(command -v ollama 2>/dev/null || ls /usr/local/bin/ollama /usr/bin/ollama 2>/dev/null | head -1)
              [ -n "$OLLAMA" ] && { echo "Launching $OLLAMA serve ..."; "$OLLAMA" serve > /tmp/ollama_canary.log 2>&1 & wait_up 120 || true; }
            fi
          fi
          check || { echo "ERROR: Ollama is not serving."; exit 1; }
          ollama --version 2>&1 | head -2 || true
          python3 - <<'PY'
          import json, urllib.request
          have = {m['name'] for m in json.load(urllib.request.urlopen('http://localhost:11434/api/tags'))['models']}
          need = json.load(open('config/models.json'))
          missing = [m for m in need if m not in have]
          print('configured models:', need)
          print('installed models :', sorted(have))
          if missing:
              raise SystemExit(f'ERROR: missing models {missing}; this canary never pulls. Pull them on the runner first.')
          PY

      - name: Forecast canary (throwaway sandbox, nothing is committed)
        run: python3 scripts/model_canary.py --tickers KO,NVDA,F,XLE,PFE,AAPL

      - name: Clean up this job's footprint on the runner
        # Runs even when an earlier step failed. Removes only OracleForge's own
        # leftovers (workspace outputs, our temp files, pip cache entries unused
        # for 30 days); the runner is shared, so other projects' workspaces,
        # the tool cache, docker and the Ollama models are left alone.
        if: always()
        run: bash scripts/runner_cleanup.sh
