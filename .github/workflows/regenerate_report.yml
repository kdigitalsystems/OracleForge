name: Regenerate GitHub Pages Report

on:
  workflow_dispatch:   # triggered by the Rebuild button on the dashboard

jobs:
  rebuild:
    # Pin to a provisioned machine for consistency with the other jobs.
    runs-on: [self-hosted, gpu]
    # Containerized like the trading jobs. The report generator is
    # stdlib-only, so no pip install or key mount is needed here.
    container:
      image: python:3.12
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate HTML report
        # No pip install needed — generate_html_report.py uses stdlib only
        run: python3 scripts/generate_html_report.py

      - name: Commit and push
        # This repo has several other automated jobs pushing to main
        # throughout the day (nightly/morning/evening + the retry watchdog),
        # so a bare push here can lose the race. Rebase and retry, and
        # regenerate the report fresh on each attempt rather than trying to
        # replay a stale diff -- docs/index.html is always fully
        # regenerable, never hand-edited, so there's nothing to merge.
        run: |
          # Container runs as root while the mounted workspace carries the
          # host user's uid; git refuses such repos (dubious ownership), and
          # for config --local the failure is a misleading "not inside a git
          # repository". Allow this workspace explicitly.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin main || { echo "Pull attempt $attempt failed; retrying in 5s..."; sleep 5; continue; }
            python3 scripts/generate_html_report.py
            git add docs/index.html
            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Regenerate dashboard (manual rebuild)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 5s..."
            git reset --soft HEAD~1
            sleep 5
          done
          echo "ERROR: could not push dashboard after 5 attempts."
          exit 1
