name: OracleForge Morning Orders

on:
  schedule:
    # Weekdays 13:30 UTC = 9:30 AM ET (market open)
    - cron: '30 13 * * 1-5'

  workflow_dispatch:

jobs:
  open:
    # 'gpu' label = fully provisioned machine (also has ~/.ssh/alpaca_paper_keys
    # and Docker, verified on both pool machines via runner_health.yml);
    # keeps the job off unprovisioned runners like servert130.
    runs-on: [self-hosted, gpu]
    # Run inside a Docker container for isolation and a reproducible Python
    # environment. The container's HOME is /github/home, so the host key file
    # is mounted to the exact path alpaca_client.py expands ~/.ssh to. The
    # pip cache mount is a container-only cache dir on the host (not the
    # runner user's own ~/.cache/pip, which the still-host-based nightly job
    # uses: container writes are root-owned and would break it).
    container:
      image: python:3.12
      volumes:
        - /home/saqib/.ssh/alpaca_paper_keys:/github/home/.ssh/alpaca_paper_keys:ro
        - /home/saqib/.cache/pip-container:/github/home/.cache/pip
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify Alpaca connection
        run: |
          python3 -c "
          import alpaca_client
          client = alpaca_client.get_trading_client()
          positions = alpaca_client.get_positions(client)
          print(f'OK: connected to Alpaca: {len(positions)} open position(s)')
          "

      - name: Check today's signals exist
        id: signals
        run: |
          python3 -c "
          import json, os, sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          # Nightly runs at 23:00 UTC the previous calendar day; check that date first,
          # then today as a fallback (e.g. if nightly ran early or same-day re-run).
          now_et = datetime.now(ZoneInfo('America/New_York'))
          candidates = [
              (now_et - timedelta(days=1)).strftime('%Y-%m-%d'),
              now_et.strftime('%Y-%m-%d'),
          ]
          path = None
          for date in candidates:
              candidate = f'reports/signals_{date}.json'
              if os.path.exists(candidate):
                  path = candidate
                  break
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          if not path:
              # A missed/failed nightly must not block position protection:
              # previously this exit(1) stopped the whole job, so held
              # positions got no profit-target sells all day (seen when the
              # 2026-08-26 nightly schedule was silently dropped by GitHub).
              # Fall through to protect-only trading instead.
              print(f'WARNING: No signals file for {candidates[0]} or {candidates[1]}.')
              print('Falling back to protect-only mode (no buys, sells still re-placed).')
              out.write('fresh=false\n')
          else:
              with open(path) as f:
                  report = json.load(f)
              active = report.get('summary', {}).get('active', 0)
              print(f'OK: {active} ACTIVE setups ({path})')
              out.write('fresh=true\n')
          "

      - name: Place limit buy orders
        run: |
          if [ "${{ steps.signals.outputs.fresh }}" = "true" ]; then
            python3 trader.py --open
          else
            python3 trader.py --open --protect-only
          fi

      - name: Commit order state
        run: |
          # Container runs as root while the mounted workspace carries the
          # host user's uid; git refuses such repos (dubious ownership), and
          # for config --local the failure is a misleading "not inside a git
          # repository". Allow this workspace explicitly.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state/open_orders.json

          if git diff --staged --quiet; then
            echo "No new orders placed."
          else
            git commit -m "Morning orders $(date -u '+%Y-%m-%d')"
            # Rebase + retry: another scheduled workflow may have advanced main.
            for attempt in 1 2 3 4 5; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
            echo "ERROR: could not push order state after 5 attempts."
            exit 1
          fi
